name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: GCC coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install coverage and OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            xorg-dev \
            xvfb
          python3 -m pip install gcovr==8.6

      - name: Configure coverage build
        run: >-
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DVSHADE_BUILD_SANDBOX=OFF
          -DVSHADE_ENABLE_COVERAGE=ON
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build tests
        run: cmake --build build-coverage --config Debug --target VShadeTests --parallel

      - name: Run tests
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24"
          ctest --test-dir build-coverage -C Debug --output-on-failure

      - name: Upload visual-test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-artifacts
          path: tests/output
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate coverage report
        run: >-
          gcovr build-coverage
          --root .
          --filter "engine/"
          --exclude "tests/"
          --exclude "engine/src/renderer/opengl/generated/"
          --cobertura-pretty
          --output coverage.xml
          --print-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          disable_search: true
          name: vshade-engine
          fail_ci_if_error: true
          use_oidc: true
